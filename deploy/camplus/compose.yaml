services:
  camplus:
    build:
      context: .
      args:
        PYTORCH_IMAGE: ${PYTORCH_IMAGE:-nvcr.io/nvidia/pytorch:25.09-py3}
    platform: linux/arm64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8008}:8000"
    volumes:
      - /home/blingcode/models/funasr/camplus:/models/camplus
    env_file:
      - .env
    environment:
      MODEL_DIR: /models/camplus
      MODEL_REVISION: ${MODEL_REVISION:-v2.0.2}
      DEVICE: cuda:0
      MODEL_WORKERS: ${MODEL_WORKERS:-2}
      MAX_PENDING: ${MAX_PENDING:-16}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    shm_size: 1gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10m
